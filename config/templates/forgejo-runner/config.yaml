runner:
  capacity: 1
  timeout: 2h
  shutdown_timeout: 30m

  labels:
    - "forgejo-ci:docker://docker.io/library/node:26-trixie@sha256:f5d1cc40abc10c2843339a2134d07817cf33c405cb16bfd052b0ed790254c3a3"

container:
  network: ""
  enable_ipv6: false
  privileged: false
  valid_volumes: []
  docker_host: "-"
  force_pull: true
  options: >-
    --cpus=4
    --memory=16g
    --pids-limit=1024

cache:
  enabled: false

server:
  connections:
    homelab:
      url: "https://git.${BASE_DOMAIN}/"
      uuid: "${FORGEJO_RUNNER_UUID}"
      token: "${FORGEJO_RUNNER_SECRET}"
