runner:
  capacity: 1
  timeout: 2h
  shutdown_timeout: 30m

  labels:
    - "forgejo-ci:docker://docker.io/library/node:26-trixie@sha256:1b84b89ada025e3b14543cbb837ffaa1c1b5273b841c5b94dd1a8f9c1d8cf7fe"

container:
  network: ""
  enable_ipv6: false
  privileged: false
  valid_volumes: []
  docker_host: "-"
  force_pull: true
  options: >-
    --cpus=4
    --memory=16g
    --pids-limit=1024

cache:
  enabled: false

server:
  connections:
    homelab:
      url: "https://git.${BASE_DOMAIN}/"
      uuid: "${FORGEJO_RUNNER_UUID}"
      token: "${FORGEJO_RUNNER_SECRET}"
