name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Validate repository and Quadlets
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --workdir /src \
            fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 \
            bash -lc 'dnf install -y git jq podman ripgrep ShellCheck >/dev/null && ./bin/validate && ./tests/static.sh && ./tests/e2e-selection.sh && ./tests/backup.sh && ./tests/legacy-restore.sh && ln -s /src /root/current && systemd-analyze verify systemd/user/homelab-backup.service systemd/user/homelab-backup.timer'

      - name: Build custom images
        run: |
          docker buildx build --pull --platform linux/amd64 --file images/caddy/Containerfile --tag localhost/homelab/caddy:test-amd64 --load images/caddy
          docker buildx build --pull --platform linux/arm64 --file images/caddy/Containerfile --tag localhost/homelab/caddy:test-arm64 --load images/caddy
          docker buildx build --pull --platform linux/amd64 --file images/radicale/Containerfile --tag localhost/homelab/radicale:test-amd64 --load images/radicale
          docker buildx build --pull --platform linux/arm64 --file images/radicale/Containerfile --tag localhost/homelab/radicale:test-arm64 --load images/radicale

  host-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Test the pinned SOPS host tool
        run: |
          docker run --rm \
            --platform linux/${{ matrix.architecture }} \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --workdir /src \
            fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 \
            bash -lc 'dnf install -y age curl diffutils >/dev/null && ./tests/host-tools.sh'

  e2e:
    needs: [validate, host-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select affected E2E workloads
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ $EVENT_NAME == pull_request ]]; then
            base_ref=$PR_BASE_SHA
            scope=$(./bin/e2e-targets "$base_ref" HEAD)
          elif [[ -z $BEFORE_SHA || $BEFORE_SHA =~ ^0+$ ]]; then
            scope=all
          else
            scope=$(./bin/e2e-targets "$BEFORE_SHA" HEAD)
          fi

          case "$scope" in
            all)
              printf 'mode=all\n' >>"$GITHUB_OUTPUT"
              printf 'E2E scope: all workloads\n'
              ;;
            none)
              printf 'mode=none\n' >>"$GITHUB_OUTPUT"
              printf 'E2E scope: no affected workloads\n'
              ;;
            *)
              printf 'mode=workloads\n' >>"$GITHUB_OUTPUT"
              printf 'workloads=%s\n' "$(paste -sd, <<<"$scope")" >>"$GITHUB_OUTPUT"
              printf 'E2E scope: %s\n' "$(tr '\n' ' ' <<<"$scope")"
              ;;
          esac

      - name: Install Podman machine prerequisites
        if: steps.scope.outputs.mode != 'none'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gvproxy jq podman qemu-system-x86 qemu-utils
          sudo mkdir -p /usr/libexec/podman
          sudo ln -sf /usr/bin/gvproxy /usr/libexec/podman/gvproxy

      - name: Run selected Podman E2E
        if: steps.scope.outputs.mode != 'none'
        env:
          E2E_MODE: ${{ steps.scope.outputs.mode }}
          E2E_WORKLOADS: ${{ steps.scope.outputs.workloads }}
        run: |
          if [[ $E2E_MODE == all ]]; then
            ./bin/e2e
            exit 0
          fi

          IFS=, read -r -a workloads <<<"$E2E_WORKLOADS"
          args=()
          for workload in "${workloads[@]}"; do
            args+=(--workload "$workload")
          done
          ./bin/e2e "${args[@]}"
