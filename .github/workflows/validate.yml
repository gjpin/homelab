name: Validate

on:
  pull_request:
  push:
    branches: [docker, main]

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      e2e_mode: ${{ steps.scope.outputs.e2e_mode }}
      e2e_workloads: ${{ steps.scope.outputs.e2e_workloads }}
      build_images: ${{ steps.scope.outputs.build_images }}
      host_tools: ${{ steps.scope.outputs.host_tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select affected CI scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ $EVENT_NAME == pull_request ]]; then
            ./bin/e2e-targets --format=ci "$PR_BASE_SHA" HEAD | tee -a "$GITHUB_OUTPUT"
          elif [[ -z $BEFORE_SHA || $BEFORE_SHA =~ ^0+$ ]]; then
            {
              printf 'e2e_mode=all\n'
              printf 'e2e_workloads=\n'
              images=()
              for dir in images/*; do
                [[ -f $dir/Containerfile ]] || continue
                images+=("$(basename -- "$dir")")
              done
              if ((${#images[@]} > 0)); then
                IFS=,
                printf 'build_images=%s\n' "${images[*]}"
                unset IFS
              else
                printf 'build_images=\n'
              fi
              printf 'host_tools=true\n'
            } | tee -a "$GITHUB_OUTPUT"
          else
            ./bin/e2e-targets --format=ci "$BEFORE_SHA" HEAD | tee -a "$GITHUB_OUTPUT"
          fi

  validate:
    needs: [select]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: needs.select.outputs.build_images != ''
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Validate repository
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep shellcheck
          ./bin/validate
          ./tests/static.sh
          ./tests/e2e-selection.sh
          ./tests/architecture.sh

      - name: Build custom images
        if: needs.select.outputs.build_images != ''
        env:
          BUILD_IMAGES: ${{ needs.select.outputs.build_images }}
        run: |
          set -Eeuo pipefail
          IFS=, read -r -a images <<<"$BUILD_IMAGES"
          for image in "${images[@]}"; do
            [[ $image =~ ^[a-z0-9]+$ ]] || {
              printf 'unexpected custom image: %s\n' "$image" >&2
              exit 1
            }
            docker buildx build --pull --platform linux/amd64 \
              --file "images/$image/Containerfile" \
              --tag "localhost/homelab/$image:test-amd64" \
              --load "images/$image"
            docker buildx build --pull --platform linux/arm64 \
              --file "images/$image/Containerfile" \
              --tag "localhost/homelab/$image:test-arm64" \
              --load "images/$image"
          done

  host-tools:
    needs: [select]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: needs.select.outputs.host_tools == 'true'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Test pinned host tools
        if: needs.select.outputs.host_tools == 'true'
        run: |
          docker run --rm --platform linux/${{ matrix.architecture }} --user 0 \
            --volume "$GITHUB_WORKSPACE:/src:ro" --workdir /src \
            debian:trixie \
            bash -lc 'apt-get update >/dev/null && apt-get install -y --no-install-recommends bzip2 ca-certificates curl jq tar >/dev/null && ./tests/host-tools.sh'

  e2e:
    needs: [select, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Report E2E scope
        env:
          E2E_MODE: ${{ needs.select.outputs.e2e_mode }}
          E2E_WORKLOADS: ${{ needs.select.outputs.e2e_workloads }}
        run: |
          case "$E2E_MODE" in
            all) printf 'E2E scope: all workloads\n' ;;
            none) printf 'E2E scope: no affected workloads\n' ;;
            *) printf 'E2E scope: %s\n' "${E2E_WORKLOADS//,/ }" ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.select.outputs.e2e_mode != 'none'

      - name: Install E2E tools
        if: needs.select.outputs.e2e_mode != 'none'
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output /tmp/age.tgz \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          tar -xzf /tmp/age.tgz -C /tmp
          sudo install -m 0755 /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output /tmp/sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Run selected Docker E2E
        if: needs.select.outputs.e2e_mode != 'none'
        env:
          E2E_MODE: ${{ needs.select.outputs.e2e_mode }}
          E2E_WORKLOADS: ${{ needs.select.outputs.e2e_workloads }}
        run: |
          if [[ $E2E_MODE == all ]]; then
            ./bin/e2e
            exit 0
          fi
          IFS=, read -r -a workloads <<<"$E2E_WORKLOADS"
          args=()
          for workload in "${workloads[@]}"; do
            args+=(--workload "$workload")
          done
          ./bin/e2e "${args[@]}"
